---
# Runs once in a repository created from this template. It replaces the
# placeholders, strips the template notices, opens a checklist issue for the
# parts a human still has to decide, and then deletes itself.
#
# It never runs in the template repository itself: `is_template` is true there
# and false in every repository generated from it.

name: Template Bootstrap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: 🧰 Personalize this repository
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ github.token }}
      PLACEHOLDERS: GITHUB_USERNAME|REPO_SLUG|PROJECT_NAME|FULL_NAME
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔎 Check whether bootstrapping is still needed
        id: check
        run: |
          set -euo pipefail
          if grep -rlIE "$PLACEHOLDERS" . \
               --exclude-dir=.git \
               --exclude=template-bootstrap.yml > /dev/null 2>&1; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No placeholders left -- nothing to do."
          fi

      - name: ✏️ Replace template placeholders
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail

          # The owner's display name, falling back to the login. The account
          # type determines whether the owner can also be a CODEOWNER.
          FULL_NAME="$(gh api "users/${OWNER}" --jq '.name // empty' || true)"
          OWNER_TYPE="$(gh api "users/${OWNER}" --jq '.type // empty' || true)"
          [ -n "$FULL_NAME" ] || FULL_NAME="$OWNER"
          [ -n "$OWNER_TYPE" ] || OWNER_TYPE="Unknown"
          echo "Owner: ${OWNER} / Type: ${OWNER_TYPE} / Repo: ${REPO} / Name: ${FULL_NAME}"
          export FULL_NAME

          # The replacements are read from the environment rather than spliced
          # into the program text, so a name containing \, &, | or / is safe.
          while IFS= read -r file; do
            echo "  updating ${file}"
            perl -pi -e '
              s/GITHUB_USERNAME/$ENV{OWNER}/g;
              s/REPO_SLUG/$ENV{REPO}/g;
              s/PROJECT_NAME/$ENV{REPO}/g;
              s/FULL_NAME/$ENV{FULL_NAME}/g;
            ' "$file"
          done < <(grep -rlIE "$PLACEHOLDERS" . \
                     --exclude-dir=.git \
                     --exclude=template-bootstrap.yml)

          # A personal account is a valid CODEOWNER. An organization account is
          # not: organization repositories must name a visible team with write
          # access in the @org/team-name form.
          if [ "$OWNER_TYPE" = "Organization" ]; then
            printf '%s\n' \
              '# Organization repositories must assign a visible team with write access.' \
              '# Replace "team-name" and uncomment the line below.' \
              "# * @${OWNER}/team-name" \
              > .github/CODEOWNERS
          elif [ "$OWNER_TYPE" != "User" ]; then
            printf '%s\n' \
              '# The bootstrap could not determine a valid CODEOWNER automatically.' \
              '# Add a GitHub user or a visible organization team with write access.' \
              '# * @username-or-org/team-name' \
              > .github/CODEOWNERS
          fi

      - name: 🧹 Remove the template scaffolding
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail

          # Keep the checklist around for the issue created further down.
          cp .github/TEMPLATE_CHECKLIST.md "${RUNNER_TEMP}/checklist.md"

          sed -i '/<!-- TEMPLATE-SETUP:START -->/,/<!-- TEMPLATE-SETUP:END -->/d' README.md
          for f in .gitattributes .gitignore; do
            sed -i '/# TEMPLATE-NOTICE:START/,/# TEMPLATE-NOTICE:END/d' "$f"
          done

          # Drop the blank lines the deletions leave at the top of each file.
          for f in README.md .gitattributes .gitignore; do
            sed -i '/./,$!d' "$f"
          done

          rm -f .github/TEMPLATE_CHECKLIST.md
          rm -f .github/workflows/template-bootstrap.yml

      - name: 📋 Open the setup checklist issue
        id: checklist
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail

          # Do not depend on the separate label-sync workflow winning a race.
          gh label create "maintenance" \
            --color "2af79e" \
            --description "Generic maintenance tasks." \
            --force

          # A failed push leaves this workflow in place, so make retries safe.
          existing_issue="$(
            gh issue list \
              --state all \
              --limit 100 \
              --json number,title \
              --jq '[.[] | select(.title == "Finish setting up this repository")][0].number // empty'
          )"

          if [ -n "$existing_issue" ]; then
            echo "The setup checklist issue already exists; not creating another."
          else
            issue_url="$(gh issue create \
              --title "Finish setting up this repository" \
              --body-file "${RUNNER_TEMP}/checklist.md" \
              --label "maintenance")"
            existing_issue="${issue_url##*/}"
          fi

          echo "issue_number=${existing_issue}" >> "$GITHUB_OUTPUT"

      - name: 💾 Commit the personalized repository
        if: steps.check.outputs.needed == 'true'
        env:
          CHECKLIST_ISSUE: ${{ steps.checklist.outputs.issue_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit \
            -m "chore: bootstrap repository from template" \
            -m "Replaced the template placeholders, removed the template notices, and removed the bootstrap workflow."

          if git push origin "HEAD:refs/heads/${BASE_BRANCH}"; then
            echo "Pushed the bootstrap commit directly to ${BASE_BRANCH}."
            exit 0
          fi

          # Protected default branches commonly reject direct writes. Preserve
          # the generated commit on a dedicated branch and propose it via PR.
          setup_branch="template-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${setup_branch}"

          if pr_result="$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$setup_branch" \
            --title "chore: bootstrap repository from template" \
            --body "The default branch rejected the bootstrap commit. This pull request applies the generated repository personalization without bypassing branch protection. If required checks are missing, close and reopen this pull request so GitHub emits a user-initiated pull-request event." \
            2>&1)"; then
            echo "Opened bootstrap pull request: ${pr_result}"
            exit 0
          fi

          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${setup_branch}?expand=1"
          if ! gh issue comment "$CHECKLIST_ISSUE" \
            --body "Branch protection rejected the direct bootstrap commit, and repository policy prevented GitHub Actions from opening a pull request. [Open the preserved setup branch as a pull request](${compare_url})."; then
            echo "::warning::Could not add the manual pull-request link to issue #${CHECKLIST_ISSUE}."
          fi

          echo "${pr_result}" >&2
          echo "::error::The bootstrap commit is preserved on ${setup_branch}, but GitHub Actions could not open its pull request."
          exit 1
