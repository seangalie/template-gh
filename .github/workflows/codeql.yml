---
# CodeQL needs at least one supported language and may require GitHub Code
# Security for private repositories. It is manual-only in the template so a new,
# empty repository does not begin with a failing workflow.
#
# After code has landed, configure the matrix below for the languages and build
# modes your project uses, then uncomment the automatic triggers below. Languages
# are auto-detected when the matrix remains commented. For example:
#   language: [javascript-typescript, python]
# See https://docs.github.com/code-security/code-scanning for the current list.

name: CodeQL

on:
  workflow_dispatch:
  # Enable these triggers after configuring CodeQL for the generated project.
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main
  # schedule:
  #   - cron: "30 1 * * 0"

permissions:
  contents: read

jobs:
  codeql:
    name: 🏭 Scanning
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     language: [javascript-typescript]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏗 Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        # with:
        #   languages: ${{ matrix.language }}
      - name: 🏗 Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      - name: 🚀 Perform CodeQL Analysis
        # When using the matrix above, also set:
        #   with:
        #     category: "/language:${{ matrix.language }}"
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
